<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLink | 나의 링크 모음</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #202536;
      --muted: #737b8c;
      --accent: #6c63ff;
      --accent-soft: #eeedff;
      --line: #e8eaf1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .profile {
      width: 100%;
      max-width: 430px;
      padding: 34px 24px 26px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 18px 55px rgba(35, 42, 70, .08);
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #8b83ff, #5d55dc);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.7px; }
    .intro { margin: 10px 0 25px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .links { display: grid; gap: 11px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      background: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
      transition: .18s ease;
    }
    .link:hover {
      transform: translateY(-2px);
      border-color: #c9c5ff;
      background: var(--accent-soft);
    }
    .link span:last-child { color: var(--accent); font-size: 19px; }
    .notice {
      margin: 20px 0 0;
      padding: 11px 13px;
      border-radius: 12px;
      color: #625caa;
      background: var(--accent-soft);
      font-size: 12px;
      line-height: 1.6;
    }
    footer { margin-top: 22px; color: #a0a5b2; font-size: 11px; letter-spacing: 1.5px; }
  </style>
</head>
<body>
  <main class="profile">
    <div class="avatar">M</div>
    <h1>MyLink</h1>
    <p class="intro">안녕하세요!<br>자주 사용하는 사이트와 소셜 링크를 한곳에 모았어요.</p>

    <nav class="links" aria-label="링크 모음">
      <!-- 아래 링크의 이름과 주소를 본인에게 맞게 수정하세요. -->
      <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
        <span>Instagram</span><span>↗</span>
      </a>
      <a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span>YouTube</span><span>↗</span>
      </a>
      <a class="link" href="https://github.com/" target="_blank" rel="noopener noreferrer">
        <span>GitHub</span><span>↗</span>
      </a>
      <a class="link" href="https://www.naver.com/" target="_blank" rel="noopener noreferrer">
        <span>My Favorite Site</span><span>↗</span>
      </a>
    </nav>

    <p class="notice">링크를 누르면 해당 사이트로 이동합니다.<br>나만의 링크 모음 페이지, MyLink</p>
    <footer>MYLINK · ALL LINKS IN ONE PLACE</footer>
  </main>
</body>
</html>
